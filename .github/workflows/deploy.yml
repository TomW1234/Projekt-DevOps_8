name: Deploy nginx to AWS ECS via Terraform

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    env:
      AWS_REGION: eu-central-1
      TF_VAR_aws_region: eu-central-1
      TF_VAR_project_name: lekce8-nginx
      TF_VAR_container_image_tag: latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform init
        working-directory: ./terraform
        run: terraform init

      - name: Create ECR only
        working-directory: ./terraform
        run: terraform apply -auto-approve -target=aws_ecr_repository.nginx

      - name: Export ECR URL
        id: ecr
        working-directory: ./terraform
        run: echo "repository_url=$(terraform output -raw ecr_repository_url)" >> "$GITHUB_OUTPUT"

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        run: |
          docker build -t nginx-custom:latest ./docker

      - name: Tag Docker image
        run: |
          docker tag nginx-custom:latest ${{ steps.ecr.outputs.repository_url }}:latest

      - name: Push Docker image to ECR
        run: |
          docker push ${{ steps.ecr.outputs.repository_url }}:latest

      - name: Terraform apply full infrastructure
        working-directory: ./terraform
        run: terraform apply -auto-approve

      - name: Show ALB DNS
        working-directory: ./terraform
        run: terraform output alb_dns_name
